<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FD Claude 安全启动器 · 节点流量 v6.7（等距均分列间隙实测验收版）</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: "FD-Fine";
      src:
        local("SF Pro Text Light"),
        local("Segoe UI Variable Text Semilight"),
        local("Noto Sans SC DemiLight"),
        local("HarmonyOS Sans SC Light"),
        local("HarmonyOS Sans SC");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "FD-Fine";
      src:
        local("SF Pro Text"),
        local("Segoe UI Variable Text"),
        local("Noto Sans SC"),
        local("HarmonyOS Sans SC");
      font-weight: 500;
      font-style: normal;
    }

    :root {
      --font-sans: "FD-Fine", "SF Pro Text", "Segoe UI Variable Text", "Noto Sans SC", "HarmonyOS Sans SC", -apple-system, sans-serif;
      --r-win: 11px;
      --r-card: 10px;
      --r-btn: 7px;
      --r-chip: 5px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 全站定稿浅色：莫兰迪苔绿 / 柔丹红 */
    [data-theme="light"] {
      --page-backdrop: #EAECEF;
      --seg-track: rgba(15, 23, 42, 0.065);
      --seg-thumb: #FFFFFF;
      --seg-thumb-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 0 0 0.5px rgba(15, 23, 42, 0.04);

      --bg-chrome: #FBFBFD;
      --bg-sidebar: #FBFBFD;
      --bg-header: #F8F9FB;
      --bg-canvas: #F5F6F8;

      --bg-card: #FFFFFF;
      --bg-card-band: #FAFBFD;
      --bg-subtle: #F2F4F7;
      --bg-nav-active: #EEF0F4;
      --bg-row-hover: rgba(15, 23, 42, 0.015);
      --sel-bar-bg: rgba(15, 23, 42, 0.012);
      --sel-bar-color: #9AA3B2;

      --border-card: rgba(15, 23, 42, 0.072);
      --border-card-hover: rgba(15, 23, 42, 0.12);
      --divider: rgba(15, 23, 42, 0.056);
      --divider-strong: rgba(15, 23, 42, 0.10);
      --icon-border: rgba(15, 23, 42, 0.052);

      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.022), 0 4px 10px -2px rgba(15, 23, 42, 0.026);
      --shadow-btn: 0 1px 1.5px rgba(15, 23, 42, 0.032);
      --shadow-window: 0 0 0 1px rgba(15, 23, 42, 0.08), 0 24px 60px -14px rgba(15, 23, 42, 0.14);

      --text-strong: #2B303B;
      --text-1: #3D4350;
      --text-2: #727A8A;
      --text-3: #8991A2;
      --text-4: #B4BCC9;

      --primary: #006CE0;
      --primary-hi: #1A84F5;
      --primary-soft: rgba(0, 108, 224, 0.068);
      --primary-border: rgba(0, 108, 224, 0.18);

      --ok-dot: #4C9E6E;
      --ok-fg: #3E8C60;
      --ok-bg: rgba(76, 158, 110, 0.065);
      --ok-border: rgba(76, 158, 110, 0.18);

      --bad-dot: #CE5A5A;
      --bad-fg: #C04D4D;
      --bad-bg: rgba(206, 90, 90, 0.062);
      --bad-border: rgba(206, 90, 90, 0.185);

      --warning-dot: #DF952E;
      --warning-fg: #B87419;
      --warning-soft: rgba(223, 149, 46, 0.075);
      --warning-border: rgba(223, 149, 46, 0.20);

      --thumb-idle: rgba(15, 23, 42, 0.072);
      --thumb-active: rgba(15, 23, 42, 0.16);

      --promo-bg: linear-gradient(135deg, rgba(0, 108, 224, 0.042) 0%, #FFFFFF 70%);
      --promo-border: rgba(0, 108, 224, 0.15);

      --tooltip-bg: #262B35;
      --tooltip-fg: #EEF1F6;
      --toast-bg: #262B35;
      --toast-fg: #F5F7FA;
    }

    /* 全站定稿暗色：v5.7 压暗柔化版 */
    [data-theme="dark"] {
      --page-backdrop: #070709;
      --seg-track: rgba(255, 255, 255, 0.065);
      --seg-thumb: #22222A;
      --seg-thumb-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);

      --bg-chrome: #111115;
      --bg-sidebar: #111115;
      --bg-header: #0F0F13;
      --bg-canvas: #0C0C0F;

      --bg-card: #15151A;
      --bg-card-band: #121217;
      --bg-subtle: #1D1D24;
      --bg-nav-active: #1B1B22;
      --bg-row-hover: rgba(255, 255, 255, 0.02);
      --sel-bar-bg: rgba(255, 255, 255, 0.02);
      --sel-bar-color: #6B7384;

      --border-card: rgba(255, 255, 255, 0.082);
      --border-card-hover: rgba(255, 255, 255, 0.13);
      --divider: rgba(255, 255, 255, 0.056);
      --divider-strong: rgba(255, 255, 255, 0.105);
      --icon-border: rgba(255, 255, 255, 0.065);

      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.24);
      --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.22);
      --shadow-window: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 28px 72px -12px rgba(0, 0, 0, 0.85);

      --text-strong: #C9CED8;
      --text-1: #B4BAC6;
      --text-2: #7D8494;
      --text-3: #646C7C;
      --text-4: #4A5160;

      --primary: #3B93FA;
      --primary-hi: #55A3FF;
      --primary-soft: rgba(59, 147, 250, 0.105);
      --primary-border: rgba(59, 147, 250, 0.23);

      --ok-dot: #449C69;
      --ok-fg: #4F9B70;
      --ok-bg: rgba(74, 158, 108, 0.062);
      --ok-border: rgba(74, 158, 108, 0.145);

      --bad-dot: #BD5F5A;
      --bad-fg: #C56B66;
      --bad-bg: rgba(196, 102, 97, 0.075);
      --bad-border: rgba(196, 102, 97, 0.175);

      --warning-dot: #C28F3E;
      --warning-fg: #BF9148;
      --warning-soft: rgba(194, 143, 62, 0.075);
      --warning-border: rgba(194, 143, 62, 0.175);

      --thumb-idle: rgba(255, 255, 255, 0.072);
      --thumb-active: rgba(255, 255, 255, 0.17);

      --promo-bg: linear-gradient(135deg, rgba(74, 158, 255, 0.07) 0%, rgba(21, 21, 26, 0.96) 65%);
      --promo-border: rgba(74, 158, 255, 0.19);

      --tooltip-bg: #22232B;
      --tooltip-fg: #D5D9E2;
      --toast-bg: #22222A;
      --toast-fg: #D5D9E2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 14px 24px 26px; min-height: 100vh;
      background: var(--page-backdrop); color: var(--text-1); font-family: var(--font-sans);
      font-weight: 400; font-synthesis: none; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center;
      transition: background-color 180ms var(--ease), color 180ms var(--ease);
    }

    .tabular { font-variant-numeric: tabular-nums; }

    .seg-bar { display: inline-flex; align-items: center; gap: 2px; padding: 2.5px; border-radius: 9px; background: var(--seg-track); }
    .seg-item {
      padding: 4px 10px; border: none; border-radius: 7px; background: transparent;
      color: var(--text-3); font-family: var(--font-sans); font-size: 11.5px; cursor: pointer; white-space: nowrap;
      transition: all 140ms var(--ease);
    }
    .seg-item:hover:not(.active) { color: var(--text-1); }
    .seg-item.active { background: var(--seg-thumb); color: var(--text-strong); font-weight: 500; box-shadow: var(--seg-thumb-shadow); }

    .fd-window {
      width: 100%; max-width: 1280px; height: 774px; border-radius: var(--r-win);
      background: var(--bg-canvas); box-shadow: var(--shadow-window); overflow: hidden;
      display: flex; flex-direction: column; user-select: none; position: relative;
      transition: background-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }

    .c-card {
      background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); overflow: hidden; transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .c-card.is-hold { border-color: var(--primary-border); background: var(--primary-soft); }

    .c-promo-slot {
      background: var(--promo-bg); border: 1px solid var(--promo-border); border-radius: var(--r-card);
      padding: 10px 12px; cursor: pointer; transition: border-color 150ms var(--ease), transform 130ms var(--ease);
    }
    .c-promo-slot:hover { border-color: var(--primary); transform: translateY(-0.5px); }

    .c-btn {
      height: 31px; padding: 0 11px; border: 1px solid var(--divider-strong); border-radius: var(--r-btn);
      background: var(--bg-card); color: var(--text-1); box-shadow: var(--shadow-btn);
      font-family: var(--font-sans); font-size: 12px; font-weight: 400;
      display: inline-flex; align-items: center; justify-content: center; gap: 5.5px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: transform 110ms var(--ease), background-color 140ms var(--ease), border-color 140ms var(--ease);
    }
    .c-btn:hover:not(:disabled) { background: var(--bg-row-hover); color: var(--text-strong); border-color: var(--border-card-hover); }
    .c-btn:active:not(:disabled) { transform: scale(0.985); }
    .c-btn-xs { height: 25px; padding: 0 9.5px; font-size: 11px; border-radius: 6px; }
    .c-btn-danger-xs {
      height: 25px; padding: 0 9.5px; font-size: 11px; border-radius: 6px;
      background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--bad-border);
      font-family: var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; white-space: nowrap;
      transition: transform 110ms var(--ease), filter 130ms var(--ease);
    }
    .c-btn-danger-xs:hover { filter: brightness(0.97); }
    .c-btn-danger-xs:active { transform: scale(0.985); }

    .in-seg {
      height: 31px; display: inline-flex; align-items: center; padding: 2.5px; border-radius: 8px;
      background: var(--seg-track); gap: 2px;
    }
    .in-seg-btn {
      height: 100%; padding: 0 11px; border: none; border-radius: 6px; background: transparent;
      color: var(--text-2); font-family: var(--font-sans); font-size: 12px; cursor: pointer; white-space: nowrap;
      transition: all 140ms var(--ease);
    }
    .in-seg-btn:hover:not(.active) { color: var(--text-strong); }
    .in-seg-btn.active { background: var(--seg-thumb); color: var(--text-strong); font-weight: 500; box-shadow: var(--seg-thumb-shadow); }

    .c-nav-item {
      height: 33px; padding: 0 10px; border: none; border-radius: var(--r-btn);
      background: transparent; color: var(--text-2); font-family: var(--font-sans); font-size: 12.5px;
      display: flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer;
      transition: background-color 130ms var(--ease), color 130ms var(--ease);
    }
    .c-nav-item:hover { background: var(--bg-nav-active); color: var(--text-1); }
    .c-nav-item.active { background: var(--bg-nav-active); color: var(--text-strong); font-weight: 500; }

    .c-status-card { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
    .c-status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; }
    .c-hold-chip {
      height: 20px; padding: 0 7px; border-radius: 5px;
      background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-border);
      font-family: var(--font-sans); font-size: 10.5px;
      display: inline-flex; align-items: center; gap: 3.5px; cursor: pointer; white-space: nowrap;
    }
    .c-hold-chip.is-active { background: var(--primary); color: #FFFFFF; border-color: transparent; }

    .c-pill {
      height: 21px; padding: 0 7.5px; border-radius: var(--r-chip);
      font-size: 11px; font-weight: 400; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 3.5px; white-space: nowrap;
    }
    .c-pill-ok { color: var(--ok-fg); background: var(--ok-bg); border: 1px solid var(--ok-border); }
    .c-pill-bad { color: var(--bad-fg); background: var(--bad-bg); border: 1px solid var(--bad-border); }
    .c-pill-warn { color: var(--warning-fg); background: var(--warning-soft); border: 1px solid var(--warning-border); }
    .c-pill-neutral { color: var(--text-2); background: var(--bg-subtle); border: 1px solid var(--divider); }

    /* 顶部统计条：节点页按内容比例分配；流量页严格 4 等分 */
    .metric-strip-nodes { display: grid; grid-template-columns: 1.32fr 0.86fr 0.96fr 1.06fr; align-items: stretch; }
    .metric-strip-equal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch; }
    .metric-cell { padding: 12px 16px; position: relative; display: flex; flex-direction: column; justify-content: flex-start; min-width: 0; }
    .metric-cell + .metric-cell::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--divider); }

    .filter-tab {
      height: 27px; padding: 0 10.5px; border-radius: 7px; border: 1px solid transparent;
      background: transparent; color: var(--text-2); font-family: var(--font-sans); font-size: 12px;
      display: inline-flex; align-items: center; gap: 5.5px; cursor: pointer; transition: all 130ms var(--ease);
    }
    .filter-tab:hover:not(.active) { color: var(--text-strong); background: var(--bg-row-hover); }
    .filter-tab.active { background: var(--bg-card); color: var(--text-strong); font-weight: 500; border-color: var(--border-card); box-shadow: var(--shadow-btn); }

    .region-box {
      width: 30px; height: 30px; border-radius: 7.5px;
      background: var(--bg-subtle); color: var(--text-2); border: 1px solid var(--icon-border);
      font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; letter-spacing: 0.03em;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .region-box.is-cur { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-border); }
    .region-box.is-warn { background: var(--warning-soft); color: var(--warning-fg); border-color: var(--warning-border); }
    .region-box.is-bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-border); }

    /* 节点质量 6 字段：同样改用实宽 + space-between 均分 5 处间隙，告别局部白沟 */
    .node-col-head, .node-row-grid {
      display: grid;
      grid-template-columns: 238px 136px 104px 160px 114px 76px;
      justify-content: space-between;
      align-items: center;
      column-gap: 12px;
    }

    /* 实时流量 7 字段：彻底禁用 fr 独吞空白，每列紧贴真实内容宽度，剩余空间由 space-between 绝对均分至全部 6 个列间隙 */
    .conn-col-head, .conn-row-grid {
      display: grid;
      grid-template-columns: 164px 140px 66px 76px 108px 66px 48px;
      justify-content: space-between;
      align-items: center;
      column-gap: 12px;
    }

    .node-col-head, .conn-col-head {
      padding: 8px 16px;
      background: var(--bg-card-band);
      border-bottom: 1px solid var(--divider);
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.01em;
    }
    .node-row-grid {
      position: relative;
      padding: 11.5px 16px;
      border-bottom: 1px solid var(--divider);
      transition: background-color 130ms var(--ease);
    }
    .conn-row-grid {
      position: relative;
      padding: 11px 16px;
      border-bottom: 1px solid var(--divider);
      transition: background-color 130ms var(--ease);
    }
    .node-row-grid:last-child, .conn-row-grid:last-child { border-bottom: none; }
    .node-row-grid:hover, .conn-row-grid:hover { background: var(--bg-row-hover); }
    .node-row-grid.is-cur { background: var(--sel-bar-bg); }
    .node-row-grid.is-cur::before {
      content: ""; position: absolute; left: 4.5px; top: 50%; transform: translateY(-50%);
      width: 2.5px; height: 20px; border-radius: 99px; background: var(--sel-bar-color);
    }

    .row-main { font-size: 12.5px; font-weight: 400; line-height: 1.38; color: var(--text-1); }
    .row-sub { margin-top: 2.5px; font-size: 11px; font-weight: 400; line-height: 1.4; color: var(--text-3); }

    .plat-ok { font-size: 11.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 3px; cursor: help; }
    .plat-ok svg { width: 11px; height: 11px; color: var(--ok-fg); opacity: 0.85; }

    .mini-bar-track { width: 42px; height: 3.5px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; }
    .mini-bar-fill { height: 100%; border-radius: 99px; }

    #hover-tooltip {
      position: fixed; max-width: 288px; padding: 7.5px 10.5px; border-radius: 8px;
      background: var(--tooltip-bg); color: var(--tooltip-fg); border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px; line-height: 1.55; white-space: pre-line; box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.36);
      pointer-events: none; z-index: 9999; display: none;
    }

    @keyframes spinFast { to { transform: rotate(360deg); } }
    .spin-icon { animation: spinFast 0.72s linear infinite; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .fd-toast { animation: toastIn 160ms var(--ease) both; }

    .chrome-btn { color: var(--text-2); transition: background-color 120ms, color 120ms; }
    .chrome-btn:hover { background: var(--bg-subtle); color: var(--text-strong); }
    .chrome-close:hover { background: #DC2626 !important; color: #FFFFFF !important; }

    .thin-scroll-host { position: relative; min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .thin-scroll-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .thin-scroll-body::-webkit-scrollbar { display: none; }
    .thin-scroll-track { position: absolute; top: 10px; bottom: 10px; right: 5px; width: 6px; pointer-events: none; z-index: 20; }
    .thin-scroll-thumb {
      position: absolute; right: 1px; top: 0; width: 3px; height: 46px; border-radius: 99px;
      background: var(--thumb-idle); pointer-events: auto; cursor: grab;
      transition: background-color 160ms var(--ease), width 140ms var(--ease), opacity 180ms var(--ease);
    }
    .thin-scroll-host:hover .thin-scroll-thumb,
    .thin-scroll-host.is-scrolling .thin-scroll-thumb { background: var(--thumb-active); }
    .thin-scroll-thumb:active { cursor: grabbing; width: 4px; }
  </style>
</head>
<body>

  <div class="w-full max-w-[1280px] mb-2.5 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2 text-[11.5px]" style="color: var(--text-2);">
      <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full"
        style="background: var(--bg-card); color: var(--text-1); border: 1px solid var(--border-card);">
        <span class="w-1.5 h-1.5 rounded-full" style="background: var(--ok-dot);"></span>
        节点流量 v6.7 · 实宽紧贴 + 等距均分 6 处列间隙（真机截图验收版）
      </span>
    </div>

    <div class="seg-bar">
      <button type="button" data-theme-opt="light" class="seg-item active">浅色版（莫兰迪）</button>
      <button type="button" data-theme-opt="dark" class="seg-item">暗色版（v5.7）</button>
    </div>
  </div>

  <div class="fd-window">
    <header class="h-[38px] shrink-0 pl-4 flex items-center justify-between transition-colors"

      tipEl.style.transform = below ? "translate(-50%, 0)" : "translate(-50%, -100%)";

    function bindThinScrollbar(hostId, bodyId, thumbId) {
      const host = document.getElementById(hostId), body = document.getElementById(bodyId), thumb = document.getElementById(thumbId);
      let hideTimer = null;
      const sync = () => {
        const scrollMax = body.scrollHeight - body.clientHeight;
        if (scrollMax <= 2) { thumb.style.opacity = "0"; thumb.style.pointerEvents = "none"; return; }
        thumb.style.opacity = "1"; thumb.style.pointerEvents = "auto";
        thumb.style.transform = `translateY(${Math.round((body.scrollTop / scrollMax) * Math.max(0, host.clientHeight - 20 - 46))}px)`;
      };
      body.addEventListener("scroll", () => { hideTip(); host.classList.add("is-scrolling"); sync(); clearTimeout(hideTimer); hideTimer = setTimeout(() => host.classList.remove("is-scrolling"), 550); });
      let dragging = false, startY = 0, startTop = 0;
      thumb.addEventListener("mousedown", (e) => { e.preventDefault(); dragging = true; startY = e.clientY; startTop = body.scrollTop; host.classList.add("is-scrolling"); });
      window.addEventListener("mousemove", (e) => { if (!dragging) return; const scrollMax = body.scrollHeight - body.clientHeight; body.scrollTop = startTop + ((e.clientY - startY) / Math.max(1, host.clientHeight - 20 - 46)) * scrollMax; });
      window.addEventListener("mouseup", () => { if (!dragging) return; dragging = false; host.classList.remove("is-scrolling"); });

              <div class="min-w-0 flex-1">
                <div class="row-main flex items-center gap-1.5 min-w-0">
                  <span class="truncate" style="color: ${isQ ? "var(--text-2)" : n.isCurrent ? "var(--text-strong)" : "var(--text-1)"};">${n.name}</span>
                  ${n.sameRegion && !n.isCurrent && !isQ ? `<span class="text-[10px] shrink-0 px-1.5 py-[0.5px] rounded-[4px]" style="background: var(--bg-subtle); color: var(--text-3);">同区</span>` : ""}
                </div>
                <div class="row-sub tabular truncate">${n.proto} · ${n.ip}</div>
              </div>
            </div>

            <div class="flex items-center gap-2.5 min-w-0">
              ${isAuditingRow
                ? `<span class="c-pill c-pill-warn !h-[19px] !text-[10.5px]"><svg class="w-2.5 h-2.5 spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.55" stroke-linecap="round"/></svg><span>检测中...</span></span>`
                : `${renderPlatBadge(n.claudeStatus, n.claudeLabel, n.claudeTip)}${renderPlatBadge(n.agyStatus, n.agyLabel, n.agyTip)}`}
            </div>

            <div class="min-w-0">
              <div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(n.ipTip)}">
                <div class="row-main truncate" style="color: ${n.ipTone === "warn" ? "var(--warning-fg)" : isQ ? "var(--text-2)" : "var(--text-1)"};">${n.ipType}</div>
                <div class="row-sub truncate">${n.ipDetail}</div>
              </div>
            </div>

            <div class="tabular min-w-0">
              <div class="row-main truncate" style="color: ${isQ ? "var(--text-2)" : "var(--text-1)"};">
                <span>${n.delayMs !== null ? `${n.delayMs} ms` : "超时"}</span>
                <span class="mx-1" style="color: var(--text-4);">·</span>
                <span style="color: ${dropWarn ? "var(--warning-fg)" : "var(--text-2)"};">${n.dropRate.toFixed(1)}% 断连</span>
              </div>
              <div class="row-sub inline-block max-w-full truncate cursor-help" style="color: ${stabWarn ? "var(--warning-fg)" : "var(--text-3)"};" data-tip="${encodeURIComponent(stabTip)}">
                抖动 ±${n.jitterMs} ms · ${n.drift > 0 ? `漂移 ${n.drift} 次` : "0 漂移"}
              </div>
            </div>

            <div class="tabular min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[12.5px]" style="color: ${scoreColor}; font-weight: 500;">${n.score} <span class="text-[10.5px] font-normal" style="color: var(--text-3);">分</span></span>
                <div class="mini-bar-track"><div class="mini-bar-fill" style="width: ${n.score}%; background: ${barColor};"></div></div>
              </div>
              <div class="row-sub truncate" style="color: ${!isQ && n.score < 75 ? "var(--warning-fg)" : "var(--text-3)"};">${n.rec}</div>
            </div>

            <div class="flex items-center justify-end">
              ${n.isCurrent
                ? `<span class="c-pill c-pill-ok">当前锁定</span>`
                : isQ
                ? `<span class="c-pill c-pill-bad">已隔离</span>`
                : `<button type="button" data-switch-id="${n.id}" class="c-btn c-btn-xs">切换锁定</button>`}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="c-card metric-strip-nodes tabular">
          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">当前锁定节点</div>
            <div class="mt-1 flex items-center gap-2 min-w-0">
              <span class="text-[10px] px-1.5 py-[1px] rounded-[4px] shrink-0" style="background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-border);">${cur.code}</span>
              <span class="text-[13.5px] truncate" style="color: var(--text-strong); font-weight: 500;">${cur.name}</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">${cur.ip} · ${cur.ipType} · ${cur.delayMs} ms</div>
          </div>

          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">可用节点</div>
            <div class="mt-1 flex items-baseline gap-1">
              <span class="text-[15px]" style="color: var(--text-strong); font-weight: 500;">${usableList.length}</span>
              <span class="text-[11px]" style="color: var(--text-3);">/ 订阅 17</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">含 ${sameList.length} 个同区热备</div>
          </div>

          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">隔离与禁区</div>
            <div class="mt-1 flex items-baseline gap-1.5">
              <span class="text-[15px]" style="color: var(--text-1); font-weight: 500;">${qList.length}</span>
              <span class="text-[11px]" style="color: var(--text-3);">· 名称禁区 9</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">落地禁区 1 · 拉黑/超时 2</div>
          </div>

          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">Mihomo 管道</div>
            <div class="mt-1 flex items-center gap-1.5 min-w-0">
              <span class="w-[5.5px] h-[5.5px] rounded-full shrink-0" style="background: var(--ok-dot);"></span>
              <span class="text-[13.5px] truncate" style="color: var(--ok-fg); font-weight: 500;">管道已直连</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">Claude-Fixed · v1.19.33 · :7890</div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3 pt-0.5">
          <div class="flex items-center gap-1">
            <button type="button" data-nfilter="usable" class="filter-tab ${state.nodeFilter === "usable" ? "active" : ""}">
              <span>可用节点</span><span class="tabular text-[11px]" style="color: var(--text-3);">${usableList.length}</span>
            </button>
            <button type="button" data-nfilter="same" class="filter-tab ${state.nodeFilter === "same" ? "active" : ""}">
              <span>同区热备</span><span class="tabular text-[11px]" style="color: var(--text-3);">${sameList.length}</span>
            </button>
            <button type="button" data-nfilter="quarantine" class="filter-tab ${state.nodeFilter === "quarantine" ? "active" : ""}">
              <span>隔离区</span><span class="tabular text-[11px]" style="color: var(--text-3);">${qList.length}</span>
            </button>
          </div>

          <div class="flex items-center gap-2.5">
            <span class="text-[11px] hidden md:inline" style="color: var(--text-3);">悬停标签可看说明 · 核验缓存 24h</span>
            ${state.nodeFilter === "quarantine" ? `<button id="btn-retest-timeout" type="button" class="c-btn c-btn-xs">重测超时类</button>` : ""}
            <button id="btn-scope-retest" type="button" class="c-btn c-btn-xs">
              <svg class="w-[11px] h-[11px] ${isScopeRunning ? "spin-icon" : ""}" style="color: var(--text-2);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><polyline points="20.5 3.5 20.5 9 15 9"/></svg>
              <span>${isScopeRunning ? "重测中..." : scopeLabel}</span>
            </button>
          </div>
        </div>

        <div class="c-card">
          <div class="node-col-head">
            <span>${state.nodeFilter === "quarantine" ? "隔离节点 / 协议" : "节点 / 出口 IP"}</span>
            <span>${state.nodeFilter === "quarantine" ? "阻断原因" : "平台支持"}</span>
            <span>节点类型</span>
            <span>延迟 / 断连 / 稳定性</span>
            <span>质量评分</span>
            <span style="text-align: right;">${state.nodeFilter === "quarantine" ? "状态" : "操作"}</span>
          </div>
          <div>${listHtml}</div>
        </div>
      `;
    }

    /* 实时流量分析 v6.7：7 列紧贴内容宽 + space-between 绝对均分 6 处列间隙，持续时长左对齐与表头齐平 */
    function renderTrafficView() {
      const activeAnom = state.conns.filter(c => c.anomaly && !c.acked).length;
      const totalAnom = state.conns.filter(c => c.anomaly).length;
      const rejectedCount = state.conns.filter(c => c.rejected).length;
      const safeCount = state.conns.filter(c => !c.anomaly && !c.rejected).length;
      const shown = state.flowFilter === "anomaly"
        ? state.conns.filter(c => c.anomaly)
        : state.flowFilter === "rejected"
        ? state.conns.filter(c => c.rejected)
        : state.conns;

      const rows = shown.length === 0
        ? `<div class="p-8 text-center text-[12px]" style="color: var(--text-3);">当前条件下无实时连接记录</div>`
        : shown.map(c => {
            const pillCls = c.anomaly
              ? (c.acked ? "c-pill-neutral" : "c-pill-bad")
              : c.rejected
              ? "c-pill-neutral"
              : "c-pill-ok";
            const pillTxt = c.anomaly
              ? (c.acked ? "已确认" : "脱组风险")
              : c.rejected
              ? "已拦截"
              : "安全放行";

            const cleanHost = formatDisplayHost(c.host);
            const hostTip = `完整目标：${c.host}\n来源进程：${c.process}`;
            const durText = formatDuration(c.durationSecs, c.rejected);
            const durTip = c.rejected
              ? `触发时刻：${c.startedAt}\n该连接已被 REJECT-DROP 规则即时阻断，未建立实际传输。`
              : `建连时刻：${c.startedAt}\n当前已持续连接 ${durText}，累计流量 ${c.bytes}。`;

            const chainHtml = c.anomaly
              ? `<div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(`完整链路：${c.fullChain}`)}">
                   <div class="row-main truncate" style="color: var(--bad-fg);">${c.exitNode}</div>
                   <div class="row-sub truncate" style="color: var(--bad-fg); opacity: 0.85;">${c.anomalySub}</div>
                 </div>`
              : c.rejected
              ? `<div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(`完整链路：${c.fullChain}`)}">
                   <div class="row-main truncate" style="color: var(--text-2);">${c.exitNode}</div>
                   <div class="row-sub truncate">${c.anomalySub}</div>
                 </div>`
              : `<div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(`完整链路：${c.fullChain}\n已默认隐藏常规前缀 Claude-Fixed`)}">
                   <div class="row-main truncate" style="color: var(--text-1);">${c.exitNode}</div>
                 </div>`;

            return `
              <div class="conn-row-grid tabular">
                <div class="min-w-0">
                  <div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(hostTip)}">
                    <div class="row-main truncate" style="color: var(--text-strong);">${cleanHost}</div>
                    <div class="row-sub truncate">${c.process}</div>
                  </div>
                </div>

                <div class="min-w-0">
                  <div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(c.purposeTip)}">
                    <div class="row-main truncate" style="color: ${c.rejected ? "var(--text-2)" : "var(--text-1)"};">${c.purposeLabel}</div>
                    <div class="row-sub truncate">${c.purposeShort}</div>
                  </div>
                </div>

                <div>
                  <span class="c-pill ${pillCls}">${pillTxt}</span>
                </div>

                <div class="min-w-0">
                  <div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(c.ruleTip)}">
                    <div class="row-main truncate" style="color: ${c.anomaly ? "var(--bad-fg)" : "var(--text-1)"};">${c.ruleLabel}</div>
                    <div class="row-sub truncate">${c.ruleCode}</div>
                  </div>
                </div>

                <div class="min-w-0">
                  ${chainHtml}
                </div>

                <div class="min-w-0">
                  <div class="inline-block max-w-full cursor-help" data-tip="${encodeURIComponent(durTip)}">
                    <div class="row-main truncate" data-dur-id="${c.id}" style="color: ${c.rejected ? "var(--text-3)" : "var(--text-1)"};">${durText}</div>
                    <div class="row-sub truncate">${c.bytes}</div>
                  </div>
                </div>

                <div class="flex items-center justify-end">
                  <button type="button" data-close-conn="${c.id}" class="${c.anomaly && !c.acked ? "c-btn-danger-xs" : "c-btn c-btn-xs"}">掐断</button>
                </div>
              </div>
            `;
          }).join("");

      return `
        <div class="c-card metric-strip-equal tabular">
          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">12h 未确认异常</div>
            <div class="mt-1 flex items-baseline gap-1">
              <span class="text-[15px]" style="color: ${activeAnom > 0 ? "var(--bad-fg)" : "var(--ok-fg)"}; font-weight: 500;">${activeAnom}</span>
              <span class="text-[11px]" style="color: var(--text-3);">条</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">含防回传拦截 ${rejectedCount} 条</div>
          </div>
          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">活跃安全连接</div>
            <div class="mt-1 flex items-baseline gap-1">
              <span class="text-[15px]" style="color: var(--ok-fg); font-weight: 500;">${safeCount}</span>
              <span class="text-[11px]" style="color: var(--text-3);">条</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">均经锁定出口稳定放行</div>
          </div>
          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">Claude 总连接</div>
            <div class="mt-1 flex items-baseline gap-1">
              <span class="text-[15px]" style="color: var(--text-strong); font-weight: 500;">${state.conns.length}</span>
              <span class="text-[11px]" style="color: var(--text-3);">条</span>
            </div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">桌面端 / CLI / 网页端</div>
          </div>
          <div class="metric-cell">
            <div class="text-[11px]" style="color: var(--text-3);">锁定策略组</div>
            <div class="mt-1 text-[13.5px] truncate" style="color: var(--text-strong); font-weight: 500;">Claude-Fixed</div>
            <div class="mt-0.5 text-[10.5px] truncate" style="color: var(--text-3);">常规连接已省略此组名前缀</div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3 pt-0.5">
          <div class="flex items-center gap-1">
            <button type="button" data-flow-filter="all" class="filter-tab ${state.flowFilter === "all" ? "active" : ""}">
              <span>全部连接</span><span class="tabular text-[11px]" style="color: var(--text-3);">${state.conns.length}</span>
            </button>
            <button type="button" data-flow-filter="anomaly" class="filter-tab ${state.flowFilter === "anomaly" ? "active" : ""}">
              <span>仅看异常</span><span class="tabular text-[11px]" style="color: var(--text-3);">${totalAnom}</span>
            </button>
            <button type="button" data-flow-filter="rejected" class="filter-tab ${state.flowFilter === "rejected" ? "active" : ""}">
              <span>遥测拦截</span><span class="tabular text-[11px]" style="color: var(--text-3);">${rejectedCount}</span>
            </button>
          </div>
          <span class="text-[11px]" style="color: var(--text-3);">默认省略 :443 与 Claude-Fixed · 悬停查看原始明细</span>
        </div>

        <div class="c-card">
          <div class="conn-col-head">
            <span>目标 / 进程</span>
            <span>链路意图</span>
            <span>状态</span>
            <span>命中规则</span>
            <span>出口 / 异常链路</span>
            <span>时长 / 流量</span>
            <span style="text-align: right;">操作</span>
          </div>
          <div>${rows}</div>
        </div>
      `;
    }

    function renderAll() {
      renderHeaderActions();
      document.getElementById("tab-quality").classList.toggle("active", state.subTab === "quality");
      document.getElementById("tab-traffic").classList.toggle("active", state.subTab === "traffic");
      document.getElementById("main-scroll-body").innerHTML = state.subTab === "quality" ? renderQualityView() : renderTrafficView();
      bindTooltips();

      const list = getFilteredNodes();
      const scopeLabel = state.nodeFilter === "usable" ? "重测可用节点" : state.nodeFilter === "same" ? "重测同区热备" : "重测隔离区";

      document.querySelectorAll("[data-nfilter]").forEach(btn => btn.addEventListener("click", () => { state.nodeFilter = btn.dataset.nfilter; renderAll(); }));
      document.getElementById("btn-scope-retest")?.addEventListener("click", () => startScopedAudit(state.nodeFilter, scopeLabel, list.length));
      document.getElementById("btn-retest-timeout")?.addEventListener("click", () => startScopedAudit("timeout", "超时类节点", 1));
      document.querySelectorAll("[data-switch-id]").forEach(btn => btn.addEventListener("click", () => {
        const nid = btn.dataset.switchId;
        const target = state.nodes.find(n => n.id === nid);
        if (!target) return;
        state.nodes.forEach(n => { n.isCurrent = n.id === nid; });
        renderAll();
        showToast(target.sameRegion ? `已切换锁定同区热备节点「${target.name}」` : `已切换至「${target.name}」· 跨洲建议静默 15~30 分钟`);
      }));
      document.querySelectorAll("[data-flow-filter]").forEach(b => b.addEventListener("click", () => { state.flowFilter = b.dataset.flowFilter; renderAll(); }));
      document.querySelectorAll("[data-close-conn]").forEach(b => b.addEventListener("click", () => {
        state.conns = state.conns.filter(c => c.id !== b.dataset.closeConn); renderAll();
        showToast("已调用 Mihomo DELETE /connections 掐断连接");
      }));

      requestAnimationFrame(() => mainScroll.sync());
    }

    setInterval(() => {
      state.conns.forEach(c => {
        if (!c.liveTick) return;
        c.durationSecs += 1;
        const el = document.querySelector(`[data-dur-id="${c.id}"]`);
        if (el) el.textContent = formatDuration(c.durationSecs, c.rejected);
      });
    }, 1000);

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelectorAll("[data-theme-opt]").forEach(b => b.classList.toggle("active", b.dataset.themeOpt === theme));
      document.getElementById("theme-ico-svg").innerHTML = theme === "dark"
        ? `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`
        : `<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>`;
    }

    document.querySelectorAll("[data-theme-opt]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeOpt)));
    document.getElementById("top-btn-theme").addEventListener("click", () => setTheme(state.theme === "light" ? "dark" : "light"));
    document.getElementById("tab-quality").addEventListener("click", () => { state.subTab = "quality"; renderAll(); });
    document.getElementById("tab-traffic").addEventListener("click", () => { state.subTab = "traffic"; renderAll(); });

    const procCard = document.getElementById("proc-card"), procDot = document.getElementById("proc-dot"), procSub = document.getElementById("proc-sub");
    const holdBtn = document.getElementById("btn-kill-hold"), holdLbl = document.getElementById("hold-label");
    holdBtn.addEventListener("click", () => {
      state.holdOn = !state.holdOn; clearInterval(state.holdTimer);
      if (state.holdOn) {
        state.holdSecs = 45; procCard.classList.add("is-hold"); holdBtn.classList.add("is-active");
        procDot.style.background = "var(--primary)"; procSub.textContent = "防复活中"; holdLbl.textContent = `解除 ${state.holdSecs}s`;
        state.holdTimer = setInterval(() => {
          state.holdSecs -= 1;
          if (state.holdSecs <= 0) { state.holdOn = false; clearInterval(state.holdTimer); procCard.classList.remove("is-hold"); holdBtn.classList.remove("is-active"); procDot.style.background = "var(--ok-dot)"; procSub.textContent = "运行中"; holdLbl.textContent = "盯防 45s"; }
          else { holdLbl.textContent = `解除 ${state.holdSecs}s`; }
        }, 1000);
      } else {
        procCard.classList.remove("is-hold"); holdBtn.classList.remove("is-active"); procDot.style.background = "var(--ok-dot)"; procSub.textContent = "运行中"; holdLbl.textContent = "盯防 45s";
      }
    });

    renderAll();
  </script>
</body>
</html>
