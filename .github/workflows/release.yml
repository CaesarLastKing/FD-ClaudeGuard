name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck and unit tests
        run: npm run build && npm test

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "FD Claude Guard v__VERSION__"
          releaseBody: |
            ## [重要] FD Claude Guard v__VERSION__

            - **[重要] 本次包含核心防裸奔冷启动修复、开机自启与 Clash 计划任务识别、控制台 19 项防叠字与全量汉化、单号卫生锁/实锤拦截闭环、账户审计支付风控拆分与真机日志降噪等全面升级，强烈建议升级。**
            - 详见仓库 [CHANGELOG.md](https://github.com/CaesarLastKing/FD-ClaudeGuard/blob/main/CHANGELOG.md)
            - 本发布包含 `latest.json` 与 Ed25519 签名文件（`.sig`），客户端可在顶栏更新提示或「系统设置 → 版本更新」一键验证升级。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
